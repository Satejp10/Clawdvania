<script>
"use strict";

// ============================================================================
// TUNING — every feel constant lives here. Tweak, refresh, replay.
// Units: px, px/s, px/s^2, seconds (ms where named *Ms).
// ============================================================================
const TUNING = {
  // Run
  runMax: 140,            // px/s top ground speed
  groundAccelTime: 0.10,  // s to reach runMax on ground
  airControl: 0.75,       // fraction of ground accel while airborne
  groundFriction: 1600,   // px/s^2 decel when no input on ground
  airFriction: 350,       // px/s^2 decel when no input in air

  // Jump (gravity + jump velocity are DERIVED from these two)
  jumpApexTiles: 3.25,    // apex height in tiles
  timeToApex: 0.32,       // s from takeoff to apex
  fallGravityMult: 1.7,   // gravity multiplier while falling
  jumpCutMult: 0.4,       // vy multiplier on jump release while rising
  maxFallSpeed: 300,      // px/s fall cap (also anti-tunneling)

  // Wall cling — hold the direction INTO the wall to hang on (Mantis Claw style).
  // Let go of that direction and Clawd drops; tap jump and he kicks off.
  wallSlideSpeed: 40,     // px/s the cling slides down at
  wallJumpMult: 0.98,     // fraction of JUMP_VEL on a kick-off
  wallJumpVx: 155,        // px/s pushed away from the wall
  wallLockMs: 130,        // horizontal input ignored after a kick-off, so you clear the wall
  wallCoyoteMs: 90,       // grace to still kick off just after sliding past the wall's end

  // Double jump — one extra beat in the air. Refreshed by ground contact AND by
  // catching a wall, so a cling-and-kick chain never strands you without it.
  airJumps: 1,            // extra jumps between one wall/ground touch and the next
  airJumpMult: 0.86,      // fraction of JUMP_VEL — lighter than a standing jump

  // Forgiveness — the stuff "feels good" is made of
  coyoteMs: 100,          // grace after walking off a ledge
  jumpBufferMs: 120,      // early jump press remembered before landing

  // Player
  hitboxW: 14,
  hitboxH: 10,

  // Camera
  camLerp: 0.12,          // per-tick lerp factor toward focus (at 60Hz)
  camDeadzoneX: 24,       // px half-width the focus can wander without pull
  camDeadzoneY: 12,
  camLookahead: 40,       // px shifted toward facing direction

  // Sprite
  idleFps: 3,             // idle breathe animation speed
  scuttleFps: 10,         // scuttle animation speed
  apexPoseVy: 80,         // px/s: slower than this, up or down, shows the top-of-jump pose
};

// ============================================================================
// Constants (not feel — structure)
// ============================================================================
const VIEW_W = 512, VIEW_H = 288;   // design viewport (16:9). Smaller = more zoomed-in.
const TILE = 16;
const STEP = 1 / 60;

// Derived jump physics: h = 1/2 g t^2  =>  g = 2h/t^2 ; v = g t = 2h/t
const APEX_PX  = TUNING.jumpApexTiles * TILE;
const GRAV_RISE = 2 * APEX_PX / (TUNING.timeToApex * TUNING.timeToApex);
const JUMP_VEL  = 2 * APEX_PX / TUNING.timeToApex;

// ============================================================================
// Level — array of strings, 1 char per tile. '#' solid, '.' empty, 'P' spawn,
// ':' hollow (empty, but roofed: the baker paints rock behind it so the sky
// doesn't show through the hillside).
// 112 wide x 38 tall. The walk is rows 0-26; rows 26-37 are the ravine.
// Cols 89-110: the homecoming meadow (cottage is drawn art, not tiles).
// Row 16 cols 20-23: secret ledge. Perch at 85-88 is the vista bench.
// The first two gaps in rows 24-25 are ditches, not pits: row 26 is solid under
// them, so they bottom out in drawn earth two tiles down. Step in, hop out (or
// cling your way up the side).
// The third gap (cols 68-72) is the mouth of the ravine, an optional side pocket
// under the walk. The gorge drops to a floor at row 36, with one-tile rungs on
// alternating walls every two rows, so plain jumps climb back out. Off its left
// side, through a door at col 67 rows 34-35, are two roofed hollows: a grotto
// (cols 62-66) and a three-wide chimney (cols 58-60). See RAVINE below.
// Cols 0 and 111 are empty above the floor: solidAt already bounds the room, so
// tiles there only baked into dark pillars standing in the sky. The floor rows
// keep theirs — blanking those would open a one-tile well at each end.
// ============================================================================
const LEVEL = [
  "................................................................................................................",
  "................................................................................................................",
  "................................................................................................................",
  "................................................................................................................",
  "................................................................................................................",
  "................................................................................................................",
  "................................................................................................................",
  "................................................................................................................",
  "................................................................................................................",
  "................................................................................................................",
  "................................................................................................................",
  "................................................................................................................",
  "................................................................................................................",
  "................................................................................................................",
  "................................................................................................................",
  "................................................................................................................",
  "....................####........................................................................................",
  ".....................................................................................####.......................",
  ".....................................#####......................................................................",
  "..............#####.............................................................................................",
  "..................................###.........................####..............####............................",
  "......#####.................................##......###.........................................................",
  "..............................####..........##.............##.............####..................................",
  "...P..........................####..........##.............##...................................................",
  "####################....######################....##################.....#######################################",
  "####################....######################....##################.....#######################################",
  "####################################################################....########################################",
  "##########################################################:::#######.....#######################################",
  "##########################################################:::########....#######################################",
  "##########################################################:::#######.....#######################################",
  "##########################################################:::#:::::#....########################################",
  "##########################################################:::#:::::#.....#######################################",
  "##########################################################:::#:::::##....#######################################",
  "##########################################################:::::::::#.....#######################################",
  "##########################################################::::::::::....########################################",
  "##########################################################::::::::::....########################################",
  "################################################################################################################",
  "################################################################################################################",
];

// Parse level
const ROOM_W = LEVEL[0].length * TILE;
const ROOM_H = LEVEL.length * TILE;
// The walk happens in the top 27 rows; everything below them is the ravine.
// The surface camera still clamps to SURFACE_H, so the walk is framed as it always was.
const SURFACE_H = 27 * TILE;
const RAVINE = {
  x0: 58 * TILE, x1: 73 * TILE,             // inside faces of its outer walls
  gorgeX0: 68 * TILE, gorgeX1: 73 * TILE,   // the open slot under the ditch
  lipY: 24 * TILE,                          // the surface line it is cut into
  floorY: 36 * TILE,                        // its floor
  panTime: 0.5,                             // s for the camera to tilt down into it, or back up
};
RAVINE.camX = (RAVINE.x0 + RAVINE.x1) / 2 - VIEW_W / 2;   // one fixed frame that shows all of it
let SPAWN = { x: 3 * TILE, y: 13 * TILE };
for (let r = 0; r < LEVEL.length; r++) {
  if (LEVEL[r].length !== LEVEL[0].length) console.error("LEVEL row " + r + " has length " + LEVEL[r].length + ", expected " + LEVEL[0].length);
  const c = LEVEL[r].indexOf("P");
  if (c >= 0) SPAWN = { x: c * TILE + (TILE - TUNING.hitboxW) / 2, y: (r + 1) * TILE - TUNING.hitboxH };
}

function solidAt(px, py) {
  if (px < 0 || px >= ROOM_W) return true;      // side walls
  if (py < 0) return false;                     // open sky
  if (py >= ROOM_H) return true;                // solid below room
  const ch = LEVEL[(py / TILE) | 0][(px / TILE) | 0];
  return ch === "#";
}

// ============================================================================
// Clawd sprite — inline pixel arrays, zero asset files.
// Palette: . transparent  d dark-coral  o coral  l light  w white  b black
// Frames are drawn facing RIGHT; flipped at draw time when facing left.
// ============================================================================
const PALETTE = {
  d: "#a94a2d",
  o: "#d97757",  // Claude coral
  l: "#f09b7d",
  w: "#ffffff",
  b: "#1d130e",
};

const SPR_W = 16, SPR_H = 12;

// Body poses only — eyes are stamped on at bake time (see EYES below), so
// 10 poses x 4 expressions never has to be hand-drawn.
// Boxy official Clawd: flat coral slab, side nubs, four stub legs.
//
// A frame may carry `hold: <seconds>` to override its set's baseline rate (see
// ANIM_FPS / TIMING below). Even cadence is the default; uneven holds are how an
// anticipation frame gets to sit while the frames around it snap past. `jump` is
// the set that uses them: its launch frame holds for 3 ticks, then the rise holds
// for as long as Clawd keeps rising.
const BODY = {
  idle: [
    { eyeY: 3, rows: [
      "................",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "oooooooooooooooo",
      "oooooooooooooooo",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "...oo.oo.oo.oo..",
      "...oo.oo.oo.oo..",
      "...oo.oo.oo.oo..",
    ]},
    { eyeY: 4, rows: [   // breathe: body settles 1px, legs compress
      "................",
      "................",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "oooooooooooooooo",
      "oooooooooooooooo",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "...oo.oo.oo.oo..",
      "...oo.oo.oo.oo..",
    ]},
  ],
  scuttle: [
    { eyeY: 3, rows: [   // legs 1 & 3 planted
      "................",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "oooooooooooooooo",
      "oooooooooooooooo",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "...oo.oo.oo.oo..",
      "...oo.oo.oo.oo..",
      "...oo....oo.....",
    ]},
    { eyeY: 3, rows: [   // all planted
      "................",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "oooooooooooooooo",
      "oooooooooooooooo",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "...oo.oo.oo.oo..",
      "...oo.oo.oo.oo..",
      "...oo.oo.oo.oo..",
    ]},
    { eyeY: 3, rows: [   // legs 2 & 4 planted
      "................",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "oooooooooooooooo",
      "oooooooooooooooo",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "...oo.oo.oo.oo..",
      "...oo.oo.oo.oo..",
      "......oo....oo..",
    ]},
  ],
  // In the air the set follows the arc (see airPose): `jump` going up, `top` near the
  // apex, `fall` coming down. `jump` runs on its own clock, started by the jump itself.
  jump: [
    { eyeY: 5, hold: 0.06, rows: [   // launch: gathered low, legs bent out. The anticipation:
      "................",            // shown while the jump is already under way, so nothing
      "................",            // waits for it. 0.06 s falls between the 3rd and 4th
      "................",            // tick, so it lasts exactly 3 ticks.
      "..oooooooooooo..",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "oooooooooooooooo",
      "oooooooooooooooo",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "..oo..oo.oo..oo.",
    ]},
    { eyeY: 1, hold: Infinity, rows: [   // rise: eyes up, arms swept down, legs trailing.
      "..oooooooooooo..",                // Held until the arc turns over.
      "..oooooooooooo..",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "oooooooooooooooo",
      "oooooooooooooooo",
      "..oooooooooooo..",
      "...oo.oo.oo.oo..",
      "...oo.oo.oo.oo..",
      "...o..o..o..o...",
      "................",
    ]},
  ],
  top: [
    { eyeY: 3, rows: [   // legs splayed, dangling (v0.2's one air pose)
      "................",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "oooooooooooooooo",
      "oooooooooooooooo",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "...oo.oo.oo.oo..",
      "...oo.......oo..",
      "................",
    ]},
  ],
  fall: [
    { eyeY: 4, rows: [   // arms flung up, eyes on the ground, legs reaching for it
      "................",
      "o.oooooooooooo.o",
      "oooooooooooooooo",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "..oooooooooooo..",
      "...oo.oo.oo.oo..",
      "...oo.oo.oo.oo..",
      "...oo.oo.oo.oo..",
    ]},
  ],
  // Drawn hooked onto a wall on the RIGHT (flipped for a left-hand wall):
  // wall-side legs reach out and grip, far-side legs tuck up under the shell.
  cling: [
    { eyeY: 3, rows: [
      "................",
      "..oooooooooooo..",
      "..oooooooooooo.o",
      "..oooooooooooo..",
      "oooooooooooooooo",
      "oooooooooooooooo",
      "..oooooooooooo.o",
      "..oooooooooooo..",
      "..oooooooooooo.o",
      "....oo.oo.oo.oo.",
      "........oo.oo...",
      "................",
    ]},
  ],
};

// Eye variants, drawn for the LEFT eye and mirrored for the right.
// dx = offset from the eye anchor column, dy = offset from the frame's eyeY.
const EYE_L_COL = 5, EYE_R_COL = 10;
const EYES = {
  open:  { dx: 0,  dy: 0, rows: ["b", "b"] },
  blink: { dx: 0,  dy: 1, rows: ["b"] },
  ouch:  { dx: -1, dy: 0, rows: ["b.", ".b", "b."] },   // >_<
  happy: { dx: -1, dy: 0, rows: [".b.", "b.b"] },       // ^_^
};

function stampEyes(rows, eyeY, v) {
  const grid = rows.map(r => r.padEnd(SPR_W, ".").split(""));
  const stamp = (vrows, colLeft) => {
    for (let dy = 0; dy < vrows.length; dy++)
      for (let dx = 0; dx < vrows[dy].length; dx++)
        if (vrows[dy][dx] !== ".") grid[eyeY + dy][colLeft + dx] = vrows[dy][dx];
  };
  const w = v.rows[0].length;
  stamp(v.rows, EYE_L_COL + v.dx);
  const mirrored = v.rows.map(r => r.split("").reverse().join(""));
  stamp(mirrored, EYE_R_COL - v.dx - w + 1);
  return grid.map(r => r.join(""));
}

// Pre-render every frame (and its mirror) to offscreen canvases at boot.
function bakeFrame(rows, flip) {
  const cv = document.createElement("canvas");
  cv.width = SPR_W; cv.height = SPR_H;
  const c = cv.getContext("2d");
  const img = c.createImageData(SPR_W, SPR_H);
  for (let y = 0; y < SPR_H; y++) {
    const row = (rows[y] || "").padEnd(SPR_W, ".");
    for (let x = 0; x < SPR_W; x++) {
      const ch = row[flip ? SPR_W - 1 - x : x];
      const hex = PALETTE[ch];
      if (!hex) continue;
      const i = (y * SPR_W + x) * 4;
      img.data[i]     = parseInt(hex.slice(1, 3), 16);
      img.data[i + 1] = parseInt(hex.slice(3, 5), 16);
      img.data[i + 2] = parseInt(hex.slice(5, 7), 16);
      img.data[i + 3] = 255;
    }
  }
  c.putImageData(img, 0, 0);
  return cv;
}
// BAKED[set][frame][expr] = { right, left } — every pose x expression, once.
const BAKED = {};
for (const name of Object.keys(BODY)) {
  BAKED[name] = BODY[name].map(f => {
    const out = {};
    for (const [ename, ev] of Object.entries(EYES)) {
      const rows = stampEyes(f.rows, f.eyeY + ev.dy, ev);
      out[ename] = { right: bakeFrame(rows, false), left: bakeFrame(rows, true) };
    }
    return out;
  });
}

// Baseline frame rate per pose set. A frame's own `hold` beats this.
const ANIM_FPS = {
  idle:    TUNING.idleFps,
  scuttle: TUNING.scuttleFps,
  jump:    1,   // both of its frames set their own hold
  top:     1,
  fall:    1,
  cling:   1,
};
// Cumulative frame end-times, built once at boot. ends[i] is when frame i stops
// being shown; total is one full cycle. Storing ends rather than durations makes
// the lookup a single walk with no running sum per render.
const TIMING = {};
for (const name of Object.keys(BODY)) {
  const base = 1 / ANIM_FPS[name];
  const ends = [];
  let t = 0;
  for (const f of BODY[name]) { t += (f.hold != null ? f.hold : base); ends.push(t); }
  TIMING[name] = { ends, total: t };
}
// Which frame of `name` is showing at `time` seconds into the animation.
function frameAt(name, time) {
  const { ends, total } = TIMING[name];
  if (ends.length === 1) return 0;
  let p = time % total;
  if (p < 0) p += total;                       // animTime never goes negative, but
  for (let i = 0; i < ends.length; i++)        // don't let a stray one index -1
    if (p < ends[i]) return i;
  return ends.length - 1;                      // only reachable on float slop at p==total
}
// In the air the pose follows the arc, not a clock: `jump` while rising, `top` while
// barely moving up or down, `fall` on the way down. Going by velocity makes it right for
// every way of leaving the ground: a hop, a full jump, a wall kick, the double jump, or
// just walking off a ledge. Visual only; the physics never reads it.
function airPose() {
  const band = TUNING.apexPoseVy;
  return player.vy < -band ? "jump" : player.vy <= band ? "top" : "fall";
}

// ============================================================================
// Game state — title / play / ending. The walk ends at the cottage door.
// ============================================================================
const game = { state: "title", t: 0, endT: 0, ended: false, tfade: 0 };
const WALK_AGAIN_T = 11;   // s into the ending before a key or tap starts the walk over
function startGame() {
  initAudio();
  if (game.state === "title") { game.state = "play"; playT = 0; }
  else if (game.state === "ending" && game.endT > WALK_AGAIN_T) resetRun();
}

// ============================================================================
// Audio — all synthesized (WebAudio), zero asset files. M toggles mute.
// Quiet Hollow-Knight bed (wind, footsteps), Ori swells at the moments.
// ============================================================================
const AU = { ctx: null, master: null, click: null, muted: false, ambT: 5, ready: false };
function initAudio() {
  if (AU.ctx) { if (AU.ctx.state === "suspended") AU.ctx.resume().catch(() => {}); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    AU.ctx = new AC();
    AU.master = AU.ctx.createGain();
    AU.master.gain.value = AU.muted ? 0 : 0.8;
    AU.master.connect(AU.ctx.destination);
    // wind bed: looped brownish noise through a soft lowpass, slow swell LFO
    const len = 2 * AU.ctx.sampleRate;
    const buf = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate);
    const d = buf.getChannelData(0);
    let lastS = 0;
    for (let i = 0; i < len; i++) { lastS = (lastS + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = lastS * 3.5; }
    const src = AU.ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = AU.ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 420; lp.Q.value = 0.4;
    const wg = AU.ctx.createGain(); wg.gain.value = 0.05;
    const lfo = AU.ctx.createOscillator(); lfo.frequency.value = 0.07;
    const lfoG = AU.ctx.createGain(); lfoG.gain.value = 0.025;
    lfo.connect(lfoG); lfoG.connect(wg.gain);
    src.connect(lp); lp.connect(wg); wg.connect(AU.master);
    src.start(); lfo.start();
    // short noise grain for footsteps
    const cl = AU.ctx.createBuffer(1, (AU.ctx.sampleRate * 0.05) | 0, AU.ctx.sampleRate);
    const cd = cl.getChannelData(0);
    for (let i = 0; i < cd.length; i++) cd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / cd.length, 2);
    AU.click = cl;
    AU.ready = true;
  } catch (e) { /* no audio; the game plays silent */ }
}
function toggleMute() {
  AU.muted = !AU.muted;
  if (AU.master) AU.master.gain.value = AU.muted ? 0 : 0.8;
}
function envG(t0, attack, peak, dur) {
  const g = AU.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(peak, t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  g.connect(AU.master);
  return g;
}
function pluck(freq, peak, dur, delay) {
  if (!AU.ready) return;
  const t0 = AU.ctx.currentTime + (delay || 0);
  const o = AU.ctx.createOscillator(); o.type = "sine"; o.frequency.value = freq;
  const o2 = AU.ctx.createOscillator(); o2.type = "sine"; o2.frequency.value = freq * 2;
  o.connect(envG(t0, 0.005, peak, dur));
  o2.connect(envG(t0, 0.005, peak * 0.25, dur * 0.6));
  o.start(t0); o2.start(t0); o.stop(t0 + dur + 0.05); o2.stop(t0 + dur + 0.05);
}
const SCALE = [392, 440, 523.25, 587.33, 659.25, 784]; // G A C D E G pentatonic — no wrong notes
function sndChime(n) {
  if (!AU.ready) return;
  const f = SCALE[(n - 1) % SCALE.length] * (n > SCALE.length ? 2 : 1);
  pluck(f, 0.13, 0.8); pluck(f * 2, 0.04, 0.5, 0.04);
}
function sndJump() {
  if (!AU.ready) return;
  const t0 = AU.ctx.currentTime;
  const o = AU.ctx.createOscillator(); o.type = "triangle";
  o.frequency.setValueAtTime(240, t0);
  o.frequency.exponentialRampToValueAtTime(430, t0 + 0.09);
  o.connect(envG(t0, 0.008, 0.05, 0.14));
  o.start(t0); o.stop(t0 + 0.2);
}
function sndAirJump() {                                    // the second beat: lighter, higher, shorter
  if (!AU.ready) return;
  const t0 = AU.ctx.currentTime;
  const o = AU.ctx.createOscillator(); o.type = "triangle";
  o.frequency.setValueAtTime(380, t0);
  o.frequency.exponentialRampToValueAtTime(720, t0 + 0.075);
  o.connect(envG(t0, 0.005, 0.035, 0.10));
  o.start(t0); o.stop(t0 + 0.16);
}
function sndLand(impact) {
  if (!AU.ready) return;
  const t0 = AU.ctx.currentTime;
  const o = AU.ctx.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(130, t0);
  o.frequency.exponentialRampToValueAtTime(65, t0 + 0.1);
  o.connect(envG(t0, 0.004, Math.min(0.14, 0.03 + impact / 3000), 0.13));
  o.start(t0); o.stop(t0 + 0.18);
}
function sndStep() {
  if (!AU.ready) return;
  const t0 = AU.ctx.currentTime;
  const s = AU.ctx.createBufferSource(); s.buffer = AU.click;
  const bp = AU.ctx.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 1500 + Math.random() * 1100; bp.Q.value = 3;
  s.connect(bp); bp.connect(envG(t0, 0.002, 0.035, 0.05));
  s.start(t0);
}
function sndGrab() {                                       // soft chitinous catch on the wall
  if (!AU.ready) return;
  const t0 = AU.ctx.currentTime;
  const s = AU.ctx.createBufferSource(); s.buffer = AU.click;
  const bp = AU.ctx.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 480 + Math.random() * 260; bp.Q.value = 1.6;
  s.connect(bp); bp.connect(envG(t0, 0.003, 0.05, 0.1));
  s.start(t0);
}
function sndSwell() {
  if (!AU.ready) return;
  const t0 = AU.ctx.currentTime;
  for (const f of [220, 277.18, 329.63, 440]) {          // warm A-major pad
    const o = AU.ctx.createOscillator(); o.type = "triangle"; o.frequency.value = f;
    const o2 = AU.ctx.createOscillator(); o2.type = "triangle"; o2.frequency.value = f * 1.003;
    const lp = AU.ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900;
    const g = AU.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.035, t0 + 1.8);
    g.gain.setValueAtTime(0.035, t0 + 3.2);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 6.5);
    o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(AU.master);
    o.start(t0); o2.start(t0); o.stop(t0 + 7); o2.stop(t0 + 7);
  }
  pluck(SCALE[2], 0.1, 1.2, 1.2); pluck(SCALE[4], 0.1, 1.2, 1.55); pluck(SCALE[5], 0.12, 1.8, 1.9);
}
function updateAmbient(dt, dusk) {
  if (!AU.ready || game.state === "title") return;
  AU.ambT -= dt;
  if (AU.ambT <= 0) {
    AU.ambT = 6 + Math.random() * 8;
    pluck(SCALE[(Math.random() * SCALE.length) | 0] / 2, 0.03 + 0.015 * dusk, 2.2);
  }
}

// ============================================================================
// Input
// ============================================================================
const input = { left: false, right: false, jumpHeld: false, jumpPressed: false };
let debugOn = false;

const KEYMAP = {
  ArrowLeft: "left", KeyA: "left",
  ArrowRight: "right", KeyD: "right",
  ArrowUp: "jump", KeyW: "jump", Space: "jump",
};

addEventListener("keydown", (e) => {
  const act = KEYMAP[e.code];
  if (act || e.code === "KeyR" || e.code === "Backquote" || e.code === "KeyM") e.preventDefault();
  if (e.repeat) return;
  startGame(); // any key dismisses the title (and still performs its action)
  if (act === "left") input.left = true;
  if (act === "right") input.right = true;
  if (act === "jump") { input.jumpHeld = true; input.jumpPressed = true; }
  if (e.code === "KeyR") resetRun();
  if (e.code === "KeyM") toggleMute();
  if (e.code === "Backquote") debugOn = !debugOn; // spec says D, but D also moves right; ` is the no-conflict toggle
});
addEventListener("pointerdown", startGame);
addEventListener("keyup", (e) => {
  const act = KEYMAP[e.code];
  if (act === "left") input.left = false;
  if (act === "right") input.right = false;
  if (act === "jump") input.jumpHeld = false;
});

// --- touch controls (mobile) — pointer events for reliable multitouch ---
// Buttons are always bound (cheap, testable); CSS visibility is gated on isTouch.
const isTouch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;

const bindTouchBtn = (id, down, up) => {
  const el = document.getElementById(id);
  const press = (e) => { e.preventDefault(); el.classList.add("held"); down(); };
  const release = (e) => { e.preventDefault(); el.classList.remove("held"); up(); };
  el.addEventListener("pointerdown", press);
  el.addEventListener("pointerup", release);
  el.addEventListener("pointercancel", release);
  el.addEventListener("pointerleave", release);
  el.addEventListener("contextmenu", (e) => e.preventDefault());
};
bindTouchBtn("tLeft",  () => { input.left = true;  }, () => { input.left = false;  });
bindTouchBtn("tRight", () => { input.right = true; }, () => { input.right = false; });
bindTouchBtn("tJump",  () => { input.jumpHeld = true; input.jumpPressed = true; }, () => { input.jumpHeld = false; });

if (isTouch) {
  document.getElementById("touch").classList.add("on");

  // landscape: overlay in portrait; try to lock orientation where allowed
  // (lock needs fullscreen on most browsers — attempt on first tap, fail silently)
  const updateOrient = () => {
    document.body.classList.toggle("portrait-touch", innerHeight > innerWidth);
  };
  addEventListener("resize", updateOrient);
  updateOrient();
  let lockTried = false;
  addEventListener("pointerdown", async () => {
    if (lockTried) return;
    lockTried = true;
    try {
      await document.documentElement.requestFullscreen({ navigationUI: "hide" });
      await window.screen.orientation.lock("landscape"); // window.screen — `screen` is shadowed by the canvas below
    } catch (e) { /* not supported or denied — the rotate overlay covers it */ }
  }, { once: false });
}

// ============================================================================
// Player
// ============================================================================
const player = {
  x: 0, y: 0, vx: 0, vy: 0,
  w: TUNING.hitboxW, h: TUNING.hitboxH,
  grounded: false, facing: 1,
  coyote: 0, buffer: 0, jumpCutDone: true,
  clinging: false, clingSide: 0, wallCoyote: 0, wallLock: 0,
  airJumpsLeft: 0,
  animTime: 0, jumpT: 0,   // animation clocks: one always running, one since the last jump began
  fallT: 0, ouchT: 0, idleT: 0, blinkT: 0, blinkNext: 3,
};

// Render/audio event tracker — derived from physics transitions, never feeds back.
const fx = {
  prevVy: 0, prevGrounded: false,
  landImpact: 0, jumped: false, walljumped: false, airjumped: false,  // consumed by render (dust, squash)
  squash: 0, squashT: 0,
  sitT: 0, kickT: 0, stepFrame: -1,
};

// Position only — this is what an out-of-bounds recovery wants. It deliberately
// leaves the run alone, so it can fire mid-walk without undoing your progress.
function resetPlayer() {
  player.x = SPAWN.x; player.y = SPAWN.y;
  player.vx = 0; player.vy = 0;
  player.grounded = false; player.facing = 1;
  player.coyote = 0; player.buffer = 0; player.jumpCutDone = true;
  player.clinging = false; player.clingSide = 0; player.wallCoyote = 0; player.wallLock = 0;
  player.airJumpsLeft = 0;
  player.fallT = 0; player.ouchT = 0; player.idleT = 0; player.blinkT = 0; player.blinkNext = 3;
  cam.x = clamp(player.x + player.w / 2 - VIEW_W / 2, 0, ROOM_W - VIEW_W);
  cam.y = clamp(player.y + player.h / 2 - VIEW_H / 2, 0, SURFACE_H - VIEW_H);
  cam.dive = 0; cam.inRavine = false;
  cam.fx = player.x + player.w / 2;
  cam.fy = player.y + player.h / 2;
}

// Start the walk over — what R means. Moving the crab back to spawn isn't enough
// once the ending has fired: game.ended stays latched, so the door trigger is
// spent forever, and the delivered wisps stay parked at the cottage eave. Undo
// the whole run, not just the position. (wisps/wispCount/playT are declared
// further down; this only ever runs from a keypress, long after they exist.)
function resetRun() {
  resetPlayer();
  game.state = "play";
  game.ended = false;
  game.endT = 0;
  playT = 0;
  wispCount = 0;
  for (const w of wisps) {
    w.state = "idle";
    w.x = w.hx; w.y = w.hy;          // back to the spot it drifts around
    w.tx = 0; w.ty = 0; w.fx = 0; w.fy = 0; w.ft = 0; w.delay = 0;
  }
}

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

// Axis-separated AABB vs tile grid: move X, resolve, then Y, resolve.
function moveAxis(axis, amount) {
  if (axis === "x") player.x += amount; else player.y += amount;
  const x0 = Math.floor(player.x), y0 = Math.floor(player.y);
  const x1 = Math.ceil(player.x + player.w) - 1, y1 = Math.ceil(player.y + player.h) - 1;
  const tx0 = Math.floor(x0 / TILE), tx1 = Math.floor(x1 / TILE);
  const ty0 = Math.floor(y0 / TILE), ty1 = Math.floor(y1 / TILE);
  let hit = false;
  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      if (!solidAt(tx * TILE, ty * TILE)) continue;
      hit = true;
      if (axis === "x") {
        if (amount > 0) player.x = tx * TILE - player.w;
        else player.x = (tx + 1) * TILE;
      } else {
        if (amount > 0) { player.y = ty * TILE - player.h; player.grounded = true; }
        else player.y = (ty + 1) * TILE;
      }
    }
  }
  return hit;
}

// Is there a solid tile flush against one side of the hitbox? (side: -1 left, +1 right)
// The vertical probe is inset top and bottom so the lip of a floor you're standing
// on, or a ceiling you're brushing, never reads as a grabbable wall.
function wallAt(side) {
  const px = side > 0 ? player.x + player.w : player.x - 1;
  if (px < 0 || px >= ROOM_W) return false;   // the room edge stops you; it isn't something to hang from
  const top = player.y + 1, bot = player.y + player.h - 2;
  for (let py = top; py < bot; py += TILE) if (solidAt(px, py)) return true;
  return solidAt(px, bot);
}

function updatePlayer(dt) {
  const T = TUNING;

  // --- timers ---
  player.coyote = player.grounded ? T.coyoteMs / 1000 : Math.max(0, player.coyote - dt);
  player.buffer = Math.max(0, player.buffer - dt);
  player.wallLock = Math.max(0, player.wallLock - dt);
  // Home: once the ending starts, input is ignored and Clawd stays at the door.
  // (tools/verify.js resets the ending after every tick, so its checks never see this.)
  const home = game.state === "ending";
  if (input.jumpPressed) { if (!home) player.buffer = T.jumpBufferMs / 1000; input.jumpPressed = false; }

  // --- horizontal (input is ignored briefly after a wall kick-off) ---
  const dir = home ? 0 : (input.right ? 1 : 0) - (input.left ? 1 : 0);
  const accel = (T.runMax / T.groundAccelTime) * (player.grounded ? 1 : T.airControl);
  if (dir !== 0 && player.wallLock <= 0) {
    player.vx = clamp(player.vx + dir * accel * dt, -T.runMax, T.runMax);
    player.facing = dir;
  } else {
    const fr = (player.grounded ? T.groundFriction : T.airFriction) * dt;
    if (Math.abs(player.vx) <= fr) player.vx = 0;
    else player.vx -= Math.sign(player.vx) * fr;
  }

  // --- wall cling: airborne, pressing into a wall, and a wall is actually there.
  // You can only START a cling when you aren't rising, so jumping up a wall you're
  // already hugging gives a full jump instead of instantly sticking to it. Once
  // you're on, you stay on until you let go of the direction.
  const wasClinging = player.clinging;
  const canCling = !player.grounded && player.wallLock <= 0 && dir !== 0 &&
                   (wasClinging || player.vy >= 0) && wallAt(dir);
  if (canCling) {
    if (!wasClinging) sndGrab();
    player.clinging = true;
    player.clingSide = dir;
    player.facing = dir;                      // face the wall you're holding
    player.vx = 0;
    player.wallCoyote = T.wallCoyoteMs / 1000;
    player.jumpCutDone = true;                // a cling ends any pending jump-cut
    player.airJumpsLeft = T.airJumps;         // catching a wall gives the second beat back
  } else {
    player.clinging = false;
    player.wallCoyote = Math.max(0, player.wallCoyote - dt);
  }

  // --- jump: ground beats a kick-off beats the air jump, when several are live ---
  // Each branch announces itself. It used to be inferred further down from "vy went
  // sharply negative", which fired a second time on every kick-off — an audibly
  // doubled note — and couldn't tell the three kinds of jump apart at all.
  if (player.buffer > 0 && player.coyote > 0) {
    player.vy = -JUMP_VEL;
    player.grounded = false;
    player.coyote = 0;
    player.buffer = 0;
    player.jumpCutDone = false;
    player.jumpT = 0;
    fx.jumped = true;
    sndJump();
  } else if (player.buffer > 0 && player.wallCoyote > 0) {
    player.vy = -JUMP_VEL * T.wallJumpMult;
    player.vx = -player.clingSide * T.wallJumpVx;
    player.facing = -player.clingSide;
    player.clinging = false;
    player.wallCoyote = 0;
    player.buffer = 0;
    player.jumpCutDone = false;
    player.wallLock = T.wallLockMs / 1000;
    player.jumpT = 0;
    fx.walljumped = true;
    sndJump();
  } else if (player.buffer > 0 && player.airJumpsLeft > 0) {
    player.airJumpsLeft--;
    player.vy = -JUMP_VEL * T.airJumpMult;   // set, not added: a late beat still lifts you
    player.buffer = 0;
    player.jumpCutDone = false;              // the second beat is variable-height too
    player.jumpT = 0;
    fx.airjumped = true;
    sndAirJump();
  }
  // variable height: cut upward velocity once on release while rising
  if (!input.jumpHeld && player.vy < 0 && !player.jumpCutDone) {
    player.vy *= T.jumpCutMult;
    player.jumpCutDone = true;
  }

  // --- gravity (asymmetric); a cling swaps it for a slow, steady slide ---
  if (player.clinging) {
    player.vy = Math.min(player.vy + GRAV_RISE * dt, T.wallSlideSpeed);
  } else {
    const g = player.vy < 0 ? GRAV_RISE : GRAV_RISE * T.fallGravityMult;
    player.vy = Math.min(player.vy + g * dt, T.maxFallSpeed);
  }

  // --- move & collide ---
  const wasGroundedMoveX = moveAxis("x", player.vx * dt);
  if (wasGroundedMoveX) player.vx = 0;
  player.grounded = false;
  const hitY = moveAxis("y", player.vy * dt);
  if (hitY) player.vy = 0;

  // landing ends a cling outright — no stale wall state while standing
  if (player.grounded) { player.clinging = false; player.wallCoyote = 0; player.airJumpsLeft = T.airJumps; }

  // fell out of a pit? (shouldn't happen — floor is solid — but belt & braces)
  if (player.y > ROOM_H + 64) resetPlayer();

  // --- expression bookkeeping (visual only) ---
  if (!player.grounded && player.vy > 0) {
    player.fallT += dt;
  } else if (player.grounded) {
    if (player.fallT > THEME.face.ouchFall) player.ouchT = THEME.face.ouchShow;
    player.fallT = 0;
  }
  player.ouchT = Math.max(0, player.ouchT - dt);
  player.idleT = (player.grounded && dir === 0 && Math.abs(player.vx) < 5) ? player.idleT + dt : 0;
  player.blinkNext -= dt;
  if (player.blinkNext <= 0) { player.blinkT = THEME.face.blinkLen; player.blinkNext = 2.5 + Math.random() * 2.5; }
  player.blinkT = Math.max(0, player.blinkT - dt);

  // --- fx & game events (visual/audio only, derived from transitions) ---
  if (player.grounded && !fx.prevGrounded && fx.prevVy > 60) {
    fx.landImpact = Math.max(fx.landImpact, fx.prevVy);
    sndLand(fx.prevVy);
  }
  // bench sit: standing still on the vista stump
  const onBench = player.grounded && dir === 0 && Math.abs(player.vx) < 5 &&
    player.x + player.w / 2 > BENCH.x0 && player.x + player.w / 2 < BENCH.x1 &&
    Math.abs(player.y + player.h - BENCH.feetY) < 1;
  fx.sitT = onBench ? fx.sitT + dt : 0;
  // arriving home: the walk ends at the cottage door
  if (game.state === "play" && !game.ended && player.grounded &&
      Math.abs(player.x + player.w / 2 - HOME.doorX) < 11) {
    game.state = "ending"; game.ended = true; game.endT = 0;
    let n = 0;
    for (const w of wisps) {
      if (w.state !== "orbit") continue;
      w.state = "fly"; w.fx = w.x; w.fy = w.y; w.ft = 0; w.delay = 0.15 + n * 0.13;
      w.tx = HOME.x + 6 + ((n + 1) * (HOME.w - 12)) / (wispCount + 1);
      w.ty = HOME.eaveY - 5 - (n % 2) * 6;
      n++;
    }
    sndSwell();
  }
  fx.prevVy = player.vy;
  fx.prevGrounded = player.grounded;

  // --- animation clocks (visual only) ---
  player.animTime += dt;
  player.jumpT += dt;
}

// ============================================================================
// Camera — lerp follow, deadzone, facing lookahead, clamped to room.
// ============================================================================
const cam = { x: 0, y: 0, fx: 0, fy: 0, dive: 0, inRavine: false }; // fx/fy = focus point; dive = 0 on the surface, 1 settled in the ravine
let camBias = 0; // extra gaze toward the meadow while sitting on the bench (visual)

function updateCamera() {
  const T = TUNING;
  camBias += ((fx.sitT > 0.8 ? 85 : 0) - camBias) * 0.02;
  const px = player.x + player.w / 2 + player.facing * T.camLookahead + camBias;
  const py = player.y + player.h / 2;

  // deadzone: focus only moves when the look point escapes the box
  const dx = px - cam.fx;
  if (dx > T.camDeadzoneX) cam.fx += dx - T.camDeadzoneX;
  else if (dx < -T.camDeadzoneX) cam.fx += dx + T.camDeadzoneX;
  const dy = py - cam.fy;
  if (dy > T.camDeadzoneY) cam.fy += dy - T.camDeadzoneY;
  else if (dy < -T.camDeadzoneY) cam.fy += dy + T.camDeadzoneY;

  // The ravine is a fixed-frame room. Below the lip and inside its footprint the camera
  // stops following and settles on one frame showing the whole pocket and the lips above
  // it. Leaving needs to be a little more decisive than entering (24px above the lip, or
  // standing on the surface), so a hop on the top rung doesn't make the frame bob.
  const pcx = player.x + player.w / 2, feet = player.y + player.h;
  const inside = pcx > RAVINE.x0 && pcx < RAVINE.x1;
  if (inside && feet > RAVINE.lipY + 1) cam.inRavine = true;
  else if (!inside || feet < RAVINE.lipY - 24 || (player.grounded && feet <= RAVINE.lipY)) cam.inRavine = false;
  cam.dive = clamp(cam.dive + (cam.inRavine ? STEP : -STEP) / RAVINE.panTime, 0, 1);
  const k = cam.dive * cam.dive * (3 - 2 * cam.dive);   // smoothstep; exactly 0 on the surface

  const surfX = clamp(cam.fx - VIEW_W / 2, 0, ROOM_W - VIEW_W);
  const surfY = clamp(cam.fy - VIEW_H / 2, 0, SURFACE_H - VIEW_H);
  const targetX = surfX + (RAVINE.camX - surfX) * k;
  const targetY = surfY + (ROOM_H - VIEW_H - surfY) * k;
  cam.x += (targetX - cam.x) * T.camLerp;
  cam.y += (targetY - cam.y) * T.camLerp;
  // clamp again so lerp overshoot can never show outside the room
  cam.x = clamp(cam.x, 0, ROOM_W - VIEW_W);
  cam.y = clamp(cam.y, 0, ROOM_H - VIEW_H);
}

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeCanvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }

const leaves = [];
{
  const rnd = mulberry32(777);
  for (let i = 0; i < THEME.leafCount; i++) leaves.push({
    x: rnd() * ROOM_W, y: rnd() * SURFACE_H,
    vy: 8 + rnd() * 14, ph: rnd() * 6.28, sp: 0.5 + rnd(),
    rot: rnd() * 6.28, rotSp: (rnd() - 0.5) * 2,
    a: 0.55 + rnd() * 0.4,
    col: THEME.leafColors[(rnd() * THEME.leafColors.length) | 0],
  });
}
function updateLeaves(dt) {
  for (const m of leaves) {
    m.ph += m.sp * dt;
    m.rot += m.rotSp * dt;
    m.x += Math.sin(m.ph) * 12 * dt;
    m.y += m.vy * dt;
    // Leaves fall through the surface band. Below it only the ones over the open gorge
    // keep going, so they drift down the gap instead of across solid rock.
    const bottom = (m.x > RAVINE.gorgeX0 && m.x < RAVINE.gorgeX1) ? RAVINE.floorY : SURFACE_H;
    if (m.y > bottom + 8) { m.y = -8; m.x = Math.random() * ROOM_W; }
    if (m.x < -8) m.x += ROOM_W;
    if (m.x > ROOM_W + 8) m.x -= ROOM_W;
  }
}

// Wisps — gentle collectibles that orbit Clawd and follow him home.
// idle (bobbing in place) -> orbit (collected) -> fly -> lantern (at the eave).
// ============================================================================
const WISP_SPOTS = [           // design px centers; 11-12 live on the secret ledge, 13-15 down the ravine
  [200, 368], [136, 323], [256, 291], [349, 344],
  [624, 275], [712, 320], [765, 357], [1016, 307],
  [1128, 352], [1408, 253],
  [336, 240], [365, 243],
  [1128, 424], [1032, 488], [952, 440],
];
const wisps = WISP_SPOTS.map(([x, y], i) => ({
  x, y, hx: x, hy: y, state: "idle", i, t: Math.random() * 6.28,
  tx: 0, ty: 0, fx: 0, fy: 0, ft: 0, delay: 0,
}));
let wispCount = 0;

function updateWisps(dt) {
  const pcx = player.x + player.w / 2, pcy = player.y + player.h / 2 - 2;
  for (const w of wisps) {
    w.t += dt;
    if (w.state === "idle") {
      w.x = w.hx + Math.sin(w.t * 1.3) * 3;
      w.y = w.hy + Math.sin(w.t * 2.1) * 4;
      const dx = w.x - pcx, dy = w.y - pcy;
      if (game.state !== "title" && dx * dx + dy * dy < 15 * 15) {
        w.state = "orbit";
        wispCount++;
        sndChime(wispCount);
      }
    } else if (w.state === "orbit") {
      const ang = w.t * 1.6 + w.i * 2.4;
      const r = 13 + (w.i % 3) * 4;
      w.x += (pcx + Math.cos(ang) * r - w.x) * Math.min(1, dt * 6);
      w.y += (pcy + Math.sin(ang) * r * 0.6 - 6 - w.y) * Math.min(1, dt * 6);
    } else if (w.state === "fly") {
      w.delay -= dt;
      if (w.delay <= 0) {
        w.ft = Math.min(1, w.ft + dt / 1.4);
        const e = 1 - Math.pow(1 - w.ft, 3);
        w.x = w.fx + (w.tx - w.fx) * e;
        w.y = w.fy + (w.ty - w.fy) * e - Math.sin(e * Math.PI) * 24;
        if (w.ft >= 1) w.state = "lantern";
      }
    } else {                    // lantern: settled at the cottage eave
      w.x = w.tx + Math.sin(w.t * 1.2 + w.i) * 1.5;
      w.y = w.ty + Math.sin(w.t * 1.7 + w.i) * 1.5;
    }
  }
}

const parts = [];
function spawnPart(x, y, vx, vy, life, size, col, a) {
  if (parts.length < 200) parts.push({ x, y, vx, vy, life, tot: life, size, col, a });
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 130 * dt;
  }
}

// ============================================================================
// Rendering — WebGL2 PROTOTYPE. Everything above this section is v0.3's game, unchanged
// (`node tools/verify.js <this file> --baseline index.html` proves the walk plays the
// same). This section replaces v0.3's Canvas 2D drawing. The world is drawn by WebGL2 with
// inline GLSL into a high-dynamic-range buffer, lit by the wisps and Clawd's glow, then
// bloomed, tone mapped and graded. The text (title, hints, cards) is still v0.3's Canvas
// 2D code, drawn on a transparent canvas on top.
//
// One frame, back to front:
//   bg      sky, drifting clouds, stars, three ranges of hills with swaying trees, the far
//           cottage and its smoke, mist. At half resolution: it's all soft, and the
//           softness reads as depth of field behind the sharp playfield.
//   light   what the wisps and Clawd's glow put on each point of the playfield. The terrain
//           blocks it: light sinks a few px into the earth and dies, so edges facing a
//           light catch it and the earth behind them stays dark.
//   world   the terrain, drawn from a distance field of LEVEL: turf, earth, pebbles, roots,
//           lit by the sky, the glow behind the hills and the light buffer. Open air shows
//           bg, plus a faint glow where light passes through the dusk.
//   grass   ~3,100 blades on every top edge, swaying in gusts and pushed aside by Clawd.
//   Clawd   pixel art built every frame from what he's doing, lit per pixel.
//   sprites wisps, their trails and sparks, leaves, dust, fireflies, motes.
//   fg      big out-of-focus leaves in the bottom corners, like the posters.
//   post    bloom, then highlights rolled off, a grade, vignette and grain.
// ============================================================================
const screen = document.getElementById("screen");    // WebGL2: the world
const hudCv = document.getElementById("hud");         // Canvas 2D on top: the text
const sctx = hudCv.getContext("2d");                  // v0.3's HUD code draws here
const CAPTURE = !!window.__capture;                   // set by the recorder, so it can read frames back
const gl = screen.getContext("webgl2", {
  alpha: false, antialias: false, depth: false, stencil: false,
  premultipliedAlpha: false, preserveDrawingBuffer: CAPTURE, powerPreference: "high-performance",
});
if (!gl) document.body.insertAdjacentHTML("beforeend", '<div style="position:fixed;inset:0;z-index:20;display:flex;' +
  'align-items:center;justify-content:center;color:#ffe9c4;background:#1a1526;font:16px system-ui">' +
  "This prototype needs WebGL2, which this browser doesn't offer.</div>");

// Quality. Phones (and ?q=low) get a smaller light buffer, softer sky and fewer bloom levels.
const QS = String(location.search || "");
const LOWQ = /[?&]q=low\b/.test(QS) || (isTouch && !/[?&]q=high\b/.test(QS));
const QUAL = {
  maxS: LOWQ ? 2.5 : 4,     // the HDR scene is drawn at up to this many px per design px, then scaled
  bg: LOWQ ? 0.34 : 0.5,    // sky and hills, as a fraction of the scene's resolution
  light: LOWQ ? 0.5 : 1,    // light buffer px per design px
  bloom: LOWQ ? 4 : 6,      // bloom levels
};

let S = 1, offX = 0, offY = 0, dpr = 1;   // design -> device px, letterbox offset (the HUD uses these)
let SR = 1, VW = 1, VH = 1;               // the scene buffer: SR px per design px, VW x VH px
let outW = 1, outH = 1, outX = 0, outY = 0;

// ---------------------------------------------------------------------------
// Colour helpers: palette entries are written as hex, like THEME. The shaders work in
// linear light, so hex is converted on the way in, and the result is written into the
// GLSL source as a literal.
// ---------------------------------------------------------------------------
const hexRGB = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
const toLinear = (h) => hexRGB(h).map((v) => Math.pow(v, 2.2));
const GV = (a) => "vec3(" + a.map((v) => v.toFixed(4)).join(",") + ")";
const LIN = (h) => GV(toLinear(h));      // linear vec3 literal
const SRGB = (h) => GV(hexRGB(h));       // sRGB vec3 literal (for gradients mixed like a canvas's)

const MAXL = 24;                          // lights per frame
const LAYER_W = VIEW_W * 2;               // the hill ranges repeat every 1024 px, as in v0.3

// ---------------------------------------------------------------------------
// GLSL
// ---------------------------------------------------------------------------
const GLSL_HEAD = "#version 300 es\nprecision highp float;\nprecision highp int;\n";
const SH_COMMON = `
uniform vec2 uCam;          // camera, design px
uniform float uTime, uDusk; // seconds; 0 at the start of the walk, 1 at the cottage
const vec2 VIEW = vec2(${VIEW_W}., ${VIEW_H}.);
const vec3 SKY_AMB = vec3(.50, .48, .66);   // light from the dusk sky, on a surface open to it
const vec3 RIM = ${LIN("#ffb27a")};          // the glow behind the hills, catching edges
const vec3 NIGHT = ${LIN("#100d2a")};
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash11(float p) { p = fract(p * .1031); p *= p + 33.33; p *= p + p; return fract(p); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
  return mix(mix(hash12(i), hash12(i + vec2(1., 0.)), u.x), mix(hash12(i + vec2(0., 1.)), hash12(i + vec2(1., 1.)), u.x), u.y);
}
float fbm(vec2 p) {
  float s = 0., a = .5;
  for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.03 + vec2(17.1, 9.7); a *= .5; }
  return s;
}
vec3 toLin(vec3 c) { return pow(max(c, 0.), vec3(2.2)); }
// how much of the glow where the sun went down reaches a point on screen
float sunAt(vec2 s) { vec2 d = (s - vec2(260., 206.)) / vec2(250., 115.); return exp(-dot(d, d) * 2.); }
// the breeze: a slow swell, a faster flutter, and a gust that rolls across left to right
// every 11 s or so (quick to arrive, slow to die)
float wind(float x, float t) {
  float w = sin(x * .031 + t * 1.1) * .55 + sin(x * .083 - t * 1.9) * .25 + sin(x * .21 + t * 3.3) * .1;
  float g = fract(t * .09 - x * .0019);
  return w + smoothstep(0., .06, g) * smoothstep(.45, .06, g) * 1.6;
}
`;

const SH_FULL_VS = `
layout(location = 0) in vec2 aPos;
out vec2 vUv;
void main() { vUv = aPos * .5 + .5; gl_Position = vec4(aPos, 0., 1.); }
`;

// ---- 1. the sky and the hills ----------------------------------------------
const SH_BG = SH_COMMON + `
uniform vec3 uPhB, uPhF, uPhM;   // phases of each range's three sines (v0.3's seeds)
uniform vec4 uTF[8], uTM[6];     // trees, far and mid range: x, ground y, size, trunk width (layer px)
uniform vec4 uCF[48], uCM[36];   // their canopy circles: x, y, r
uniform vec2 uHome;              // the far cottage's foot, layer px
uniform float uHomeA;            // its fade (it hands over to the real one near the end)
in vec2 vUv;
out vec4 o;

float ridge(float xl, float base, float amp, vec3 ph) {
  float a = xl * ${(2 * Math.PI / LAYER_W).toFixed(9)};
  return base + sin(a + ph.x) * amp + sin(a * 3. + ph.y) * amp * .4 + sin(a * 7. + ph.z) * amp * .15;
}
// v0.3's sky stops, mixed in sRGB as a canvas gradient mixes them
vec3 skyRamp(float y) {
  vec3 c = mix(${SRGB("#1d2252")}, ${SRGB("#33305f")}, clamp(y / .30, 0., 1.));
  c = mix(c, ${SRGB("#55406c")}, clamp((y - .30) / .16, 0., 1.));
  c = mix(c, ${SRGB("#80506d")}, clamp((y - .46) / .10, 0., 1.));
  c = mix(c, ${SRGB("#b56664")}, clamp((y - .56) / .07, 0., 1.));
  c = mix(c, ${SRGB("#df8a58")}, clamp((y - .63) / .06, 0., 1.));
  c = mix(c, ${SRGB("#f0a45e")}, clamp((y - .69) / .05, 0., 1.));
  return mix(c, ${SRGB("#f3b46a")}, clamp((y - .74) / .26, 0., 1.));
}
float cloudAt(vec2 s) {
  vec2 p = vec2(s.x + uCam.x * .03 + uTime * 3., s.y);
  float band = smoothstep(46., 92., s.y) * smoothstep(196., 146., s.y);
  float n = fbm(vec2(p.x * .0085, p.y * .048)) + .42 * fbm(vec2(p.x * .026, p.y * .1) + 4.7);
  return smoothstep(.74, 1.06, n) * band;
}
// one canopy circle of a tree, v0.3's radial gradient plus leafy clumps and a lit top edge
void canopy(inout vec3 col, vec2 q, vec2 s, vec4 c, vec2 off, vec3 hi, vec3 lo, float id) {
  vec2 cc = c.xy + off, dv = q - cc;
  float d = length(dv);
  if (d > c.z * 1.2 + 1.) return;
  float ang = atan(dv.y, dv.x);
  float rr = c.z * (1. + .09 * sin(ang * 7. + id * 3.1) + .05 * sin(ang * 12. + id * 1.7));   // leafy, scalloped edge
  float cov = smoothstep(rr + .7, rr - .7, d);
  if (cov <= 0.) return;
  // v0.3's light from the upper left of each clump, broken into a few painted tones
  float t = clamp((length(dv - vec2(-.3, -.4) * c.z) - .15 * c.z) / (c.z * 1.1), 0., 1.);
  t = clamp(t + (vnoise(q * .17 + id * 5.7) - .5) * .45, 0., 1.);
  t = mix(t, floor(t * 3. + .5) / 3., .7);
  vec3 cs = toLin(mix(hi, lo, t)) * .9;
  float rim = smoothstep(rr - 2., rr - .2, d) * smoothstep(.3, -.7, dv.y / c.z);
  col = mix(col, cs + RIM * rim * (.1 + .9 * sunAt(s)), cov);
}
void main() {
  vec2 s = vec2(vUv.x, 1. - vUv.y) * VIEW;
  float lift = max(0., 144. - uCam.y);   // the camera rises on the high ledges: far things move less

  // ---- sky ----
  vec3 sk = skyRamp(s.y / VIEW.y);
  vec2 sd = (s - vec2(260., 212.)) / vec2(230., 103.5);
  sk = mix(sk, vec3(1., .69, .376), .38 * clamp(1. - length(sd), 0., 1.));   // v0.3's sun glow
  vec3 col = toLin(sk);
  // the last of the sun, hot right on the horizon (this is what blooms)
  col += ${LIN("#ffb066")} * .38 * exp(-pow((s.y - 196.) / 20., 2.)) * exp(-pow((s.x - 262.) / 150., 2.));
  // stars: a few at the top from the start, more as the dusk deepens
  vec2 g = floor(s / 3.);
  float h = hash12(g + 7.1);
  float clouds = cloudAt(s);
  if (h > .978 && s.y < 165.) {
    vec2 c = (g + .5 + (vec2(hash12(g + 1.3), hash12(g + 2.9)) - .5) * 1.6) * 3.;
    float tw = .55 + .45 * sin(uTime * (1.3 + h * 5.) + h * 40.);
    float st = smoothstep(1., 0., length(s - c)) * tw * (.12 + .88 * uDusk) * smoothstep(165., 40., s.y);
    col += vec3(.95, .9, 1.) * st * 1.3 * (1. - clouds);
  }
  // clouds: long streaks in the warm band, lit from below by the glow
  if (clouds > 0.) {
    float under = clamp((cloudAt(s - vec2(0., 2.5)) - cloudAt(s + vec2(0., 2.5))) * 2.2, 0., 1.);
    vec3 cb = mix(${LIN("#3a3363")}, ${LIN("#8a5470")}, smoothstep(70., 185., s.y));
    vec3 cl = ${LIN("#ffa070")} * (.25 + 1.1 * sunAt(s));
    col = mix(col, cb + cl * (.25 + .75 * under), clouds * .8);
  }

  // ---- the back range: pale and warm, half lost in the glow, a treeline along its crest ----
  {
    float f = .12, xl = mod(s.x + uCam.x * f, 1024.), y = s.y - lift * f;
    float top = ridge(xl, 198., 12., uPhB) - smoothstep(.5, .75, vnoise(vec2(xl * .09, 1.))) * (1.2 + 2.2 * vnoise(vec2(xl * .55, 5.)));
    float a = smoothstep(-.7, .7, y - top);
    if (a > 0.) {
      vec3 c = mix(${SRGB("#76526c")}, ${SRGB("#5c4565")}, clamp((y - 166.) / 122., 0., 1.));
      float hz = y < 198. ? .30 * clamp((y - 150.) / 48., 0., 1.) : mix(.30, .18, clamp((y - 198.) / 90., 0., 1.));
      c = mix(c, mix(vec3(.91, .55, .38), vec3(.59, .35, .47), clamp((y - 198.) / 90., 0., 1.)), hz);   // v0.3's haze
      vec3 lc = toLin(c) * (.92 + .16 * vnoise(vec2(xl * .05, y * .1)));
      lc += RIM * exp(-(y - top) / 1.1) * (.2 + 1.1 * sunAt(s));
      col = mix(col, lc, a);
    }
  }
  // ---- the far range, its trees, and home on its crest ----
  {
    float f = .25, xl = mod(s.x + uCam.x * f, 1024.), y = s.y - lift * f;
    vec2 q = vec2(xl, y);
    float top = ridge(xl, 200., 26., uPhF);
    float a = smoothstep(-.7, .7, y - top);
    if (a > 0.) {
      vec3 c = mix(${SRGB("#5b4a63")}, ${SRGB("#463a52")}, clamp((y - 154.) / 134., 0., 1.));
      vec3 lc = toLin(c) * (.9 + .2 * vnoise(vec2(xl * .07, y * .12)));
      lc = mix(lc, ${LIN("#c9876a")}, .16 * smoothstep(240., 190., y));   // haze
      lc += RIM * exp(-(y - top) / 1.0) * (.15 + 1.0 * sunAt(s));
      col = mix(col, lc, a);
    }
    for (int i = 0; i < 8; i++) {
      vec4 t = uTF[i];
      float dx = xl - t.x; dx -= 1024. * floor(dx / 1024. + .5);
      if (abs(dx) > t.z * 1.5 + 2. || y < t.y - t.z * 3.3 || y > t.y + 1.) continue;
      vec2 lq = vec2(t.x + dx, y);
      if (abs(dx) < t.w * .5 && y > t.y - t.z * 1.5) col = mix(col, ${LIN("#3a2f42")}, .9);
      float sw = sin(uTime * .8 + float(i) * 1.9) * .3 * t.z / 16.;
      for (int k = 0; k < 6; k++) {
        vec4 c = uCF[i * 6 + k];
        canopy(col, lq, s, c, vec2(sw * clamp((t.y - c.y) / (t.z * 2.4), 0., 1.), 0.),
               ${SRGB("#b0684a")}, ${SRGB("#6e4340")}, float(i * 6 + k));
      }
    }
    // the cottage (not wrapped: it stands at one place on the walk, like v0.3's)
    if (uHomeA > 0.) {
      vec2 hq = vec2(s.x + uCam.x * f, y) - uHome;

const SH_LIGHT = SH_COMMON + `
uniform sampler2D uSdf;

// A signed distance field of the terrain, one texel per design px: + in open air, - in

    const d = set.data, bend = set.bend, vel = set.vel;

  gl.uniform3fv(u.uPhB, RANGES.back.ph); gl.uniform3fv(u.uPhF, RANGES.far.ph); gl.uniform3fv(u.uPhM, RANGES.mid.ph);
  gl.uniform4fv(u.uTF, RANGES.far.trees); gl.uniform4fv(u.uCF, RANGES.far.circ);
  gl.uniform4fv(u.uTM, RANGES.mid.trees); gl.uniform4fv(u.uCM, RANGES.mid.circ);
  gl.uniform2f(u.uHome, THEME.far.cottageX, THEME.far.cottageY);
  gl.uniform1f(u.uHomeA, w.farHome);
  fullScreen();

  // ---- 2. light buffer ----
  useRT(G.light);
  u = useProg("light", w);
  bindTex(0, G.sdf); gl.uniform1i(u.uSdf, 0);
  gl.uniform2f(u.uRoom, ROOM_W, ROOM_H);
  gl.uniform4fv(u.uL, lightP); gl.uniform4fv(u.uLc, lightC); gl.uniform1i(u.uN, nL);
  fullScreen();

  // ---- 3. terrain over the sky ----
  useRT(G.scene);
  u = useProg("world", w);
  bindTex(0, G.bg.tex); gl.uniform1i(u.uBg, 0);
  bindTex(1, G.light.tex); gl.uniform1i(u.uLight, 1);
  bindTex(2, G.sdf); gl.uniform1i(u.uSdf, 2);
  gl.uniform2f(u.uRoom, ROOM_W, ROOM_H);
  gl.uniform1f(u.uS, SR);
  gl.uniform1f(u.uScatter, 0.05);
  gl.uniform4f(u.uHomeP, HOME.x, HOME.groundY, HOME.w, game.ended ? Math.min(1, game.endT / 1.3) : 0);
  gl.uniform1f(u.uDoor, w.door);
  fullScreen();

  // ---- 4-7. grass, Clawd, sprites, foreground, all blended onto the scene ----
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  const grassPass = (set) => {
    u = useProg("grass", w);
    gl.uniform1f(u.uS, SR);
    bindTex(1, G.light.tex); gl.uniform1i(u.uLight, 1);
    gl.uniform2f(u.uRes, VW, VH);
    gl.bindVertexArray(set.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, set.bendBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, set.bend);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 10, set.n);
  };
  const sprites = (group, additive) => {
    if (!SPR.groups[group] || !SPR.groups[group].n) return;
    u = useProg("spr", w);
    bindTex(1, G.light.tex); gl.uniform1i(u.uLight, 1);
    gl.uniform2f(u.uRes, VW, VH);
    if (additive) gl.blendFunc(gl.ONE, gl.ONE); else gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    drawGroup(group);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  };
  grassPass(GRASS.back);
  sprites("under", false);
  sprites("wispsBehind", true);
  if (w.clawdA > 0) {
    u = useProg("clawd", w);
    gl.bindVertexArray(G.vaoEmpty);
    bindTex(3, G.clawdAlb); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, CW, CH, gl.RGBA, gl.UNSIGNED_BYTE, cAlb); gl.uniform1i(u.uAlb, 3);
    bindTex(4, G.clawdNrm); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, CW, CH, gl.RGBA, gl.UNSIGNED_BYTE, cNrm); gl.uniform1i(u.uNrm, 4);
    // whole screen pixels per sprite pixel, like v0.3, with the feet on the hitbox
    const k = Math.max(1, Math.round(SR));
    const fxp = Math.round((w.footX - camX) * SR), fyp = Math.round((w.footY - camY) * SR);
    gl.uniform4f(u.uRect, fxp - (CW / 2) * k, fyp - CH * k, CW * k, CH * k);
    gl.uniform2f(u.uRes, VW, VH);
    gl.uniform2f(u.uFoot, w.footX, w.footY);
    gl.uniform2f(u.uGrid, CW, CH);
    gl.uniform1f(u.uAlpha, w.clawdA);
    gl.uniform4fv(u.uL, lightP); gl.uniform4fv(u.uLc, lightC); gl.uniform1i(u.uN, nL);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  grassPass(GRASS.front);
  sprites("over", true);
  sprites("fg", false);
  gl.disable(gl.BLEND);

  // ---- 8. bloom ----
  const B = G.bloom;
  if (B.length) {
    u = useProg("down", w);
    gl.uniform1i(u.uSrc, 0);
    let src = G.scene;
    for (let i = 0; i < B.length; i++) {
      useRT(B[i]);
      bindTex(0, src.tex);
      gl.uniform2f(u.uTexel, 1 / src.w, 1 / src.h);
      gl.uniform1f(u.uFirst, i === 0 ? 1 : 0);
      gl.uniform1f(u.uThresh, 1.0); gl.uniform1f(u.uKnee, 0.5);
      fullScreen();
      src = B[i];
    }
    u = useProg("up", w);
    gl.uniform1i(u.uSrc, 0);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    for (let i = B.length - 1; i > 0; i--) {
      useRT(B[i - 1]);
      bindTex(0, B[i].tex);
      gl.uniform2f(u.uTexel, 1 / B[i].w, 1 / B[i].h);
      fullScreen();
    }
    gl.disable(gl.BLEND);
  }

  // ---- to the screen ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, screen.width, screen.height);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.viewport(outX, screen.height - outY - outH, outW, outH);
  u = useProg("final", w);
  bindTex(0, G.scene.tex); gl.uniform1i(u.uScene, 0);
  bindTex(1, B.length ? B[0].tex : G.scene.tex); gl.uniform1i(u.uBloom, 1);
  gl.uniform1f(u.uBloomK, B.length ? 0.65 : 0);
  gl.uniform1f(u.uExpo, 1.0);
  gl.uniform1f(u.uGrain, 0.028);
  gl.uniform2f(u.uRes, outW, outH);
  fullScreen();
}

// ---------------------------------------------------------------------------
// Resize, init
// ---------------------------------------------------------------------------
function onResize() {
  // Physical pixels, capped at 2 (audit finding 5), as v0.3 does.
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const pw = Math.round(innerWidth * dpr), ph = Math.round(innerHeight * dpr);
  for (const c of [screen, hudCv]) {
    c.width = pw; c.height = ph;
    c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px";
  }
  S = Math.min(pw / VIEW_W, ph / VIEW_H);
  offX = (pw - VIEW_W * S) / 2;
  offY = (ph - VIEW_H * S) / 2;
  outW = Math.round(VIEW_W * S); outH = Math.round(VIEW_H * S);
  outX = Math.round(offX); outY = Math.round(offY);
  SR = Math.min(S, QUAL.maxS);
  VW = Math.round(VIEW_W * SR); VH = Math.round(VIEW_H * SR);
  if (gl) glTargets();
}
if (gl) glInit();
addEventListener("resize", onResize);
onResize();

// ---------------------------------------------------------------------------
// render(): v0.3's bookkeeping in v0.3's order (the clocks, the wisps, the particles),
// then the WebGL frame, then v0.3's HUD.
// ---------------------------------------------------------------------------
let playT = 0; // seconds of play — fades the control hint out after a few seconds
function render(fps, dt) {
  const cx = Math.round(cam.x);
  game.t += dt;
  if (game.state !== "title") playT += dt;
  if (game.state !== "title" && game.tfade < 1) game.tfade = Math.min(1, game.tfade + dt / 0.7);
  if (game.ended) game.endT += dt;
  // dusk deepens as the camera travels toward home (0 at spawn, 1 at the cottage)
  const duskD = clamp((cx + VIEW_W / 2 - 260) / 1200, 0, 1);
  updateAmbient(dt, duskD);
  updateLeaves(dt);

  const expr = player.ouchT > 0 ? "ouch"
    : (game.ended && game.endT < 7) ? "happy"
    : fx.sitT > 1.5 ? "happy"
    : player.idleT > THEME.face.happyAfter ? "happy"
    : player.blinkT > 0 ? "blink" : "open";
  const clawdA = game.ended ? 1 - clamp((game.endT - 3.6) / 0.6, 0, 1) : 1;

  // v0.3's effects bookkeeping: the same particles, from the same events
  const landing = fx.landImpact;
  if (fx.landImpact > 0) {
    fx.squash = Math.min(0.3, fx.landImpact / 900);
    fx.squashT = 0.16;
    const n = 3 + Math.min(6, (fx.landImpact / 60) | 0);
    for (let i = 0; i < n; i++)
      spawnPart(player.x + player.w / 2 + (Math.random() - 0.5) * 10, player.y + player.h,
        (Math.random() - 0.5) * 70, -(10 + Math.random() * 40),
        0.3 + Math.random() * 0.15, 1 + Math.random() * 1.5, THEME.mist.tint, 0.5);
    fx.landImpact = 0;
  }
  if (fx.jumped) {
    for (let i = 0; i < 3; i++)
      spawnPart(player.x + player.w / 2 + (Math.random() - 0.5) * 8, player.y + player.h,
        (Math.random() - 0.5) * 50, 10 + Math.random() * 20,
        0.25, 1 + Math.random(), THEME.mist.tint, 0.4);
    fx.jumped = false;
  }
  if (fx.airjumped) {                                     // a ring of air kicked out underfoot
    for (let i = 0; i < 9; i++) {
      const a = (i / 9) * Math.PI * 2;
      spawnPart(player.x + player.w / 2 + Math.cos(a) * 4, player.y + player.h - 2,
        Math.cos(a) * 52, Math.sin(a) * 14 + 6,
        0.3, 1 + Math.random(), THEME.mist.tint, 0.5);
    }
    fx.squash = -0.16;
    fx.squashT = 0.16;
    fx.airjumped = false;
    anim.tuck = 0.14;
  }
  if (fx.walljumped) {                                    // dust kicked off the wall face
    const wx = player.x + (player.clingSide > 0 ? player.w : 0);
    for (let i = 0; i < 4; i++)
      spawnPart(wx, player.y + 2 + Math.random() * 7,
        -player.clingSide * (25 + Math.random() * 45), 10 + Math.random() * 25,
        0.3, 1 + Math.random(), THEME.mist.tint, 0.45);
    fx.walljumped = false;
  }
  fx.kickT -= dt;
  if (player.clinging && player.vy > 5 && fx.kickT <= 0) {              // scrape while sliding
    fx.kickT = 0.09;
    const wx = player.x + (player.clingSide > 0 ? player.w : 0);
    spawnPart(wx, player.y + 3 + Math.random() * 6,
      -player.clingSide * (8 + Math.random() * 16), -(4 + Math.random() * 12),
      0.35, 1, THEME.mist.tint, 0.4);
  }
  if (player.grounded && Math.abs(player.vx) > 110 && fx.kickT <= 0) {   // grass flecks
    fx.kickT = 0.12;
    spawnPart(player.x + (player.vx > 0 ? 0 : player.w), player.y + player.h - 1,
      -Math.sign(player.vx) * (20 + Math.random() * 30), -(20 + Math.random() * 30),
      0.4, 1.2, Math.random() < 0.4 ? THEME.grassGlow : THEME.grass, 0.7);
  }
  composeClawd(dt, expr);                    // reads fx.squash/squashT before they run down
  if (fx.squashT > 0) fx.squashT -= dt;

  updateWisps(dt);
  updateParts(dt);
  updateWispFx(dt);
  updateGrass(dt, landing);

  if (gl) {
    drawGL({
      camX: cam.x, camY: cam.y, time: game.t, dusk: duskD,
      farHome: farHomeAlpha(cx), clawdA,
      door: game.ended ? Math.sin(Math.PI * clamp((game.endT - 3.3) / 1.6, 0, 1)) : 0,
      pcx: player.x + player.w / 2, pcy: player.y + player.h / 2 - 2,
      footX: player.x + player.w / 2, footY: player.y + player.h,
    });
  }
  drawHud(fps);
}

// v0.3's HUD, unchanged, drawn on the transparent canvas over the WebGL one.
function drawHud(fps) {
  sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.clearRect(0, 0, hudCv.width, hudCv.height);
  // ---- HUD at native resolution (drawn after transform reset = razor sharp) ----
  sctx.setTransform(1, 0, 0, 1, 0, 0);
  const PX = d => offX + d * S, PY = d => offY + d * S, PS = d => d * S;
  sctx.textBaseline = "top";

  if (debugOn) {
    sctx.fillStyle = "rgba(0,0,0,0.6)";
    sctx.fillRect(PX(2), PY(2), PS(184), PS(70));
    sctx.fillStyle = "#7CFC9A";
    sctx.font = PS(8) + "px monospace";
    const L = [
      "pos  " + player.x.toFixed(1) + ", " + player.y.toFixed(1),
      "vel  " + player.vx.toFixed(1) + ", " + player.vy.toFixed(1),
      "grounded " + player.grounded + "  facing " + (player.facing > 0 ? "R" : "L"),
      "coyote " + (player.coyote * 1000).toFixed(0) + "ms  buffer " + (player.buffer * 1000).toFixed(0) + "ms  air " + player.airJumpsLeft,
      "cling " + (player.clinging ? (player.clingSide > 0 ? "R" : "L") : "-") +
        "  wallCoy " + (player.wallCoyote * 1000).toFixed(0) + "ms  lock " + (player.wallLock * 1000).toFixed(0) + "ms",
      "fps " + fps.toFixed(0) + "  cam " + cam.x.toFixed(0) + "," + cam.y.toFixed(0),
    ];
    for (let i = 0; i < L.length; i++) sctx.fillText(L[i], PX(6), PY(6 + i * 10));
  }

  // Letter-spaced capitals like the posters, centred on x. Spaced by hand, because
  // canvas letterSpacing isn't in every browser yet.
  const spaced = (text, x, y, gap) => {
    const ws = [...text].map((ch) => sctx.measureText(ch).width);
    let px = x - (ws.reduce((a, b) => a + b, 0) + gap * (ws.length - 1)) / 2;
    sctx.textAlign = "left";
    [...text].forEach((ch, i) => { sctx.fillText(ch, px, y); px += ws[i] + gap; });
  };

  // hint — native-res sans-serif, fades out after the first few seconds of play
  // (skipped on touch devices — they have on-screen buttons instead)
  const hintA = (isTouch || game.state === "title") ? 0 : Math.max(0, Math.min(0.55, (6 - playT) * 0.6));
  if (hintA > 0.002) {
    sctx.fillStyle = "rgba(235,240,245," + hintA.toFixed(3) + ")";
    sctx.font = "600 " + PS(8.5) + "px system-ui, -apple-system, sans-serif";
    sctx.textAlign = "center";
    sctx.fillText("arrows / A D  move      space  jump      R  reset      M  mute      `  debug",
      PX(VIEW_W / 2), PY(VIEW_H - 15));
    sctx.textAlign = "left";
  }

  // wisp counter — quiet, top-right, only once you've met one
  if (wispCount > 0) {
    const wcx = PX(VIEW_W - 24), wcy = PY(12);
    sctx.globalAlpha = 0.6;
    const g = sctx.createRadialGradient(wcx, wcy, 0.5, wcx, wcy, PS(5));
    g.addColorStop(0, "rgba(255,230,170,0.9)");
    g.addColorStop(1, "rgba(255,200,120,0)");
    sctx.fillStyle = g;
    sctx.fillRect(wcx - PS(5), wcy - PS(5), PS(10), PS(10));
    sctx.fillStyle = "#ffe9c4";
    sctx.font = "600 " + PS(8) + "px system-ui, sans-serif";
    sctx.textAlign = "left";
    sctx.fillText(String(wispCount), wcx + PS(7), wcy - PS(4));
    sctx.globalAlpha = 1;
  }

  // title card — fades away on the first input
  const titleA = 1 - game.tfade;
  if (titleA > 0.002) {
    // on the open sky above the ledges, the way the posters set it; the prompt sits on
    // the dark earth at the bottom
    const tg = sctx.createLinearGradient(0, offY, 0, offY + PS(150));
    tg.addColorStop(0, "rgba(10,8,22," + (0.35 * titleA).toFixed(3) + ")");
    tg.addColorStop(1, "rgba(10,8,22,0)");
    sctx.fillStyle = tg;
    sctx.fillRect(offX, offY, VIEW_W * S, PS(150));
    sctx.fillStyle = "rgba(255,233,196," + (0.95 * titleA).toFixed(3) + ")";
    sctx.font = PS(26) + "px Georgia, 'Times New Roman', serif";
    spaced("CLAWDVANIA", PX(VIEW_W / 2), PY(34), PS(3.2));
    sctx.fillStyle = "rgba(255,233,196," + (0.72 * titleA).toFixed(3) + ")";
    sctx.font = "600 " + PS(7) + "px system-ui, sans-serif";
    spaced("A WALK HOME AT DUSK", PX(VIEW_W / 2), PY(70), PS(2.6));
    const pulse = 0.45 + 0.3 * Math.sin(game.t * 2.2);
    sctx.fillStyle = "rgba(235,240,245," + (pulse * titleA).toFixed(3) + ")";
    sctx.font = "600 " + PS(8) + "px system-ui, sans-serif";
    sctx.textAlign = "center";
    sctx.fillText(isTouch ? "tap to begin" : "press any key to begin", PX(VIEW_W / 2), PY(262));
    sctx.textAlign = "left";
  }

  // end card — welcome home
  if (game.ended) {
    const a = Math.min(1, Math.max(0, (game.endT - 2.2) / 1)) *
              (1 - Math.min(1, Math.max(0, (game.endT - 8.5) / 1.5)));
    if (a > 0.002) {
      sctx.textAlign = "center";
      sctx.fillStyle = "rgba(255,233,196," + (0.9 * a).toFixed(3) + ")";
      sctx.font = "700 " + PS(17) + "px Georgia, 'Times New Roman', serif";
      sctx.fillText("welcome home", PX(VIEW_W / 2), PY(92));
      const sub = wispCount >= WISP_SPOTS.length ? "every last wisp came home with you"
        : wispCount > 0 ? wispCount + (wispCount === 1 ? " wisp" : " wisps") + " followed you home"
        : "the dusk walked you home";
      sctx.fillStyle = "rgba(235,240,245," + (0.6 * a).toFixed(3) + ")";
      sctx.font = "italic " + PS(9) + "px Georgia, serif";
      sctx.fillText(sub, PX(VIEW_W / 2), PY(118));
      sctx.textAlign = "left";
    }
  }

  // closing — once the welcome has faded, night settles over the cottage and a last card
  // offers the walk again (startGame handles the key or tap)
  if (game.ended && game.endT > 10) {
    const k = Math.min(1, (game.endT - 10) / 2);
    sctx.fillStyle = "rgba(10,8,22," + (0.45 * k).toFixed(3) + ")";
    sctx.fillRect(offX, offY, VIEW_W * S, VIEW_H * S);
    sctx.fillStyle = "rgba(255,233,196," + (0.9 * k).toFixed(3) + ")";
    sctx.font = PS(18) + "px Georgia, 'Times New Roman', serif";
    spaced("CLAWDVANIA", PX(VIEW_W / 2), PY(96), PS(2.4));
    sctx.fillStyle = "rgba(235,240,245," + (0.65 * k).toFixed(3) + ")";
    sctx.font = "italic " + PS(9) + "px Georgia, serif";
    sctx.textAlign = "center";
    sctx.fillText("thanks for walking home", PX(VIEW_W / 2), PY(124));
    sctx.fillStyle = "rgba(235,240,245," + (0.5 * k).toFixed(3) + ")";
    sctx.font = PS(7.5) + "px Georgia, 'Times New Roman', serif";
    sctx.fillText("by Satej Patil · made with Claude Code", PX(VIEW_W / 2), PY(146));
    if (game.endT > WALK_AGAIN_T) {
      const pulse = 0.45 + 0.3 * Math.sin(game.t * 2.2);
      sctx.fillStyle = "rgba(235,240,245," + (pulse * k).toFixed(3) + ")";
      sctx.font = "600 " + PS(8) + "px system-ui, sans-serif";
      sctx.fillText(isTouch ? "tap to walk again" : "press any key to walk again", PX(VIEW_W / 2), PY(262));
    }
    sctx.textAlign = "left";
  }
}

// ============================================================================
// Fixed-timestep loop (accumulator). Delta clamped; accumulator reset on
// tab-visibility regain (Topple's tab-hidden desync bug — not repeating it).
// ============================================================================
let last = performance.now();
let acc = 0;
let fpsSmooth = 60;

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { last = performance.now(); acc = 0; }
});

function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1;               // clamp huge deltas (tab switch, hitching)
  if (dt > 0) fpsSmooth += (1 / dt - fpsSmooth) * 0.05;

  acc += dt;
  while (acc >= STEP) {
    updatePlayer(STEP);
    updateCamera();
    acc -= STEP;
  }
  render(fpsSmooth, dt);
  requestAnimationFrame(frame);
}

resetPlayer();
requestAnimationFrame(frame);
</script>
</body>
</html>
